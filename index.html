<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K&S Valley — a Pied Piper company</title>
  <meta name="description" content="K&S: making the world a better place, one destination at a time." />

  <script>(function(){try{var t=localStorage.getItem('kns-theme-v2')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>

  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css?v=13" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥧</text></svg>" />
</head>
<body class="app">
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">☀ light mode</button>

  <!-- ======================= K&S VALLEY (the whole experience) ======================= -->
  <section class="valley" id="valley">
    <div id="countrymap"></div>

    <div class="valley-title">
      <h1 id="scene-title">K&amp;S Valley 🥧</h1>
      <p id="breadcrumb">drag to explore · click a building or country</p>
    </div>

    <button class="valley-back" id="valley-back" type="button" hidden>← back to the valley</button>

    <div class="valley-controls">
      <button id="vz-in" type="button" aria-label="Zoom in">+</button>
      <button id="vz-out" type="button" aria-label="Zoom out">−</button>
      <button id="vz-reset" type="button" aria-label="Fit view">⤾</button>
    </div>
  </section>

  <!-- Sliding info panel (place stories, the birthday message, stats) -->
  <div class="panel" id="panel" hidden>
    <div class="panel-card">
      <button class="panel-close" id="panel-close" type="button" aria-label="Close">×</button>
      <div class="panel-body" id="panel-body"><!-- filled by world.js --></div>
    </div>
  </div>

  <!-- ✏️ EDIT ME: the birthday message (shown when you click Pied Piper HQ) -->
  <template id="tpl-message">
    <div class="card-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="path">~/k-and-s/LAUNCH_v35.md</span>
    </div>
    <div class="message-body">
      <h2>🥧 Announcing: <span class="accent">You, v35.0</span></h2>
      <p>Today we're thrilled to announce the most important launch I've ever backed:
        <b>you</b>, now shipping version 35. After an exhaustive market analysis, the
        board (me) has concluded you are, in fact, the category-defining unicorn. 🦄</p>
      <p>In a space full of noise, you're the rare founder with equal parts brilliance
        and absurd charm — and a heart big enough to disrupt entire industries. You
        dream in bold, ambitious roadmaps, and somehow you make everyone around you
        believe the impossible is just one more sprint away.</p>
      <p>But my favorite feature? The way you make me feel — safe, seen, and endlessly
        at home, no matter the timezone. No pivot, no funding round, no nine-figure exit
        could ever be worth more than that. You really are making <i>my</i> world a
        better place.</p>
      <p>So happy 35th birthday to my favorite founder — the CEO of Us, Inc. Here's to
        another year of big dreams, bigger adventures, and going full middle-out. 🚀</p>
      <p class="signature">// with all my love for you, and your love for tech 💻🥧</p>
    </div>
  </template>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js?v=13"></script>
  <script src="js/theme.js?v=13"></script>
  <script src="js/easter.js?v=13"></script>
  <script type="module" src="js/world3d.js?v=13"></script>
</body>
</html>
